type Parent {
  id: ID!
  email: String!
  name: String
  createdAt: AWSDateTime!
}

type Child {
  id: ID!
  parentId: ID!
  name: String!
  avatar: String
  birthday: AWSDate!
  createdAt: AWSDateTime!
}

enum Activity {
  SIGHT_WORD
}

enum ChallengeType {
  MULTIPLE_CHOICE
  SPELL
}

type Attempt {
  id: ID!
  childId: ID!
  activity: Activity!
  target: String!
  challengeType: ChallengeType!
  correct: Boolean!
  occurredAt: AWSDateTime!
  receivedAt: AWSDateTime!
}

type Query {
  myProfile: Parent
  myChildren: [Child!]!
}

input CreateChildProfileInput {
  name: String!
  avatar: String
  birthday: AWSDate!
}

"""
`attemptId` identifies the attempt: recording it again returns the stored attempt
instead of writing a second one, so it is safe to retry. Generate it once, when the
child answers, and reuse it for every retry.
"""
input RecordAttemptInput {
  """Unique per attempt (8-64 characters, no '#'), e.g. a UUID or ULID."""
  attemptId: ID!
  childId: ID!
  activity: Activity!
  target: String!
  challengeType: ChallengeType!
  answer: String!
  presentedOptions: [String!]
  """
  When the child answered. Ignored on a retry of an attempt already recorded (the
  stored attempt keeps its original time).
  """
  occurredAt: AWSDateTime!
}

type Mutation {
  createChildProfile(input: CreateChildProfileInput!): Child!
  recordAttempt(input: RecordAttemptInput!): Attempt!
}

schema {
  query: Query
  mutation: Mutation
}

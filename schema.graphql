type Parent {
  id: ID!
  email: String!
  name: String
  createdAt: AWSDateTime!
}

type Child {
  id: ID!
  parentId: ID!
  name: String!
  avatar: String
  birthday: AWSDate!
  createdAt: AWSDateTime!
}

enum Activity {
  SIGHT_WORD
}

enum ChallengeType {
  CHOOSE_FROM_BANK
  SPELL
}

type Attempt {
  id: ID!
  childId: ID!
  activity: Activity!
  targetId: ID!
  challengeType: ChallengeType!
  correct: Boolean!
  occurredAt: AWSDateTime!
  receivedAt: AWSDateTime!
}

type Query {
  myProfile: Parent
  myChildren: [Child!]!
}

input CreateChildProfileInput {
  name: String!
  avatar: String
  birthday: AWSDate!
}

input RecordAttemptInput {
  attemptId: ID!
  childId: ID!
  activity: Activity!
  targetId: ID!
  challengeType: ChallengeType!
  selectedAnswer: String!
  presentedOptions: [String!]
  occurredAt: AWSDateTime!
}

type Mutation {
  createChildProfile(input: CreateChildProfileInput!): Child!
  recordAttempt(input: RecordAttemptInput!): Attempt!
}

schema {
  query: Query
  mutation: Mutation
}

type Parent {
  id: ID!
  email: String!
  name: String
  createdAt: AWSDateTime!
}

type Child {
  id: ID!
  parentId: ID!
  name: String!
  avatar: String
  birthday: AWSDate
  createdAt: AWSDateTime!
}

type Query {
  myProfile: Parent
  myChildren: [Child!]!
}

input CreateChildProfileInput {
  name: String!
  avatar: String
  birthday: AWSDate
}

type Mutation {
  createChildProfile(input: CreateChildProfileInput!): Child!
}

schema {
  query: Query
  mutation: Mutation
}

type Parent {
  id: ID!
  email: String!
  name: String
  createdAt: AWSDateTime!
}

type Child {
  id: ID!
  parentId: ID!
  name: String!
  avatar: String
  birthday: AWSDate!
  createdAt: AWSDateTime!
}

enum WordStatus {
  IN_PROGRESS
  NEEDS_SUPPORT
  MASTERED
}

type WordProgress {
  childId: ID!
  word: String!
  status: WordStatus!
  attempts: Int!
  lastPracticedAt: AWSDateTime!
}

type Query {
  myProfile: Parent
  myChildren: [Child!]!
  childWordProgress(childId: ID!, status: WordStatus): [WordProgress!]!
}

input CreateChildProfileInput {
  name: String!
  avatar: String
  birthday: AWSDate!
}

type Mutation {
  createChildProfile(input: CreateChildProfileInput!): Child!
  recordWordAttempt(childId: ID!, word: String!, status: WordStatus!): WordProgress!
}

schema {
  query: Query
  mutation: Mutation
}

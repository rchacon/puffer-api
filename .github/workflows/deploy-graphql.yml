name: deploy graphql

on:
  push:
    tags:
      - 'graphql-v*'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    env:
      DYNAMODB_ENDPOINT: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches package.json
        id: version
        run: scripts/check-tag-version.sh "$GITHUB_REF_NAME" graphql-v package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "$DYNAMODB_ENDPOINT"; then
              echo "DynamoDB Local is up"
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local did not become ready in time" >&2
          exit 1

      - name: Create DynamoDB table
        run: npm run create-table

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build -- resolvers

      - name: Generate AppSync CloudFormation template
        run: npm run build:appsync-template

      - name: Install cfn-lint
        run: pipx install cfn-lint

      - name: Validate generated CloudFormation template
        run: cfn-lint build/appsync-template.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GRAPHQL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy schema + resolvers + pipeline functions
        run: |
          aws cloudformation deploy \
            --template-file build/appsync-template.json \
            --stack-name puffer-api-graphql \
            --parameter-overrides \
              ApiId="${{ vars.APPSYNC_API_ID }}" \
              DataSourceName="${{ vars.APPSYNC_DATA_SOURCE_NAME }}" \
            --no-fail-on-empty-changeset
